<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vietflex OpenMap</title>

  <link rel="stylesheet" href="./dist/vietflex.css?v=20260916-0900">
  <script src="./dist/vietflex.js?v=20260916-0900"></script>
  <script src="./dist/vietflex-core.js?v=20260916-0900"></script>
  <script src="./dist/vietflex-platform.js?v=20260916-0900"></script>

  <style>
    html, body {
      margin: 0;
      height: 100%;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    #map { width: 100%; height: 100%; }

    .vf-map-credit {
      position: absolute;
      right: 46px;
      bottom: 6px;
      z-index: 999;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 5px 10px;
      border: 1px solid rgba(21, 101, 192, .14);
      border-radius: 7px;
      background: rgba(255, 255, 255, .97);
      box-shadow: 0 1px 5px rgba(0, 0, 0, .16);
      color: #1565c0;
      font: 700 12px/1.2 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      white-space: nowrap;
      text-decoration: none;
      cursor: pointer;
    }

    .vf-map-credit:hover { color: #0d47a1; background: #fff; }
    .vf-map-credit:focus-visible { outline: 2px solid #1565c0; outline-offset: 2px; }

    .vf-flag {
      width: 20px;
      height: 14px;
      display: inline-flex;
      overflow: hidden;
      border-radius: 2px;
      box-shadow: 0 0 0 1px rgba(0, 0, 0, .08);
      flex: 0 0 auto;
    }

    .vf-flag svg { width: 100%; height: 100%; display: block; }

    .vf-attrib-wrap {
      position: absolute;
      right: 8px;
      bottom: 6px;
      z-index: 1000;
    }

    .vf-attrib-toggle {
      width: 30px;
      height: 30px;
      border: 0;
      border-radius: 50%;
      background: rgba(255,255,255,.97);
      box-shadow: 0 1px 5px rgba(0,0,0,.18);
      color: #17212b;
      font: 700 18px/30px Georgia, serif;
      padding: 0;
      cursor: pointer;
    }

    .vf-attrib-toggle:hover { background: #fff; }
    .vf-attrib-toggle:focus-visible { outline: 2px solid #1565c0; outline-offset: 2px; }

    .vf-attrib-panel {
      position: absolute;
      right: 0;
      bottom: 36px;
      display: none;
      width: max-content;
      max-width: min(720px, calc(100vw - 24px));
      padding: 7px 10px;
      border-radius: 7px;
      background: rgba(255,255,255,.98);
      box-shadow: 0 2px 10px rgba(0,0,0,.20);
      color: #26313b;
      font: 11px/1.4 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      white-space: normal;
    }

    .vf-attrib-panel.is-open { display: block; }
    .vf-attrib-panel a { color: #1565c0; text-decoration: none; }
    .vf-attrib-panel a:hover { text-decoration: underline; }

    /* Tọa độ rê chuột: đặt sát thước tỷ lệ ở góc trái dưới. */
    .vf-coordinate-control {
      position: absolute;
      left: 118px;
      bottom: 6px;
      z-index: 998;
      display: inline-flex;
      align-items: stretch;
      min-height: 28px;
      border: 1px solid rgba(0,0,0,.12);
      border-radius: 6px;
      background: rgba(255,255,255,.96);
      box-shadow: 0 1px 4px rgba(0,0,0,.15);
      overflow: hidden;
      color: #17212b;
      font: 11px/1.2 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }

    .vf-coordinate-modes {
      display: inline-flex;
      border-right: 1px solid rgba(0,0,0,.10);
    }

    .vf-coordinate-mode {
      border: 0;
      border-right: 1px solid rgba(0,0,0,.08);
      background: transparent;
      color: #53606d;
      font: 700 10px/1 system-ui, sans-serif;
      padding: 0 8px;
      cursor: pointer;
    }

    .vf-coordinate-mode:last-child { border-right: 0; }
    .vf-coordinate-mode.is-active { color: #0d47a1; background: #eaf3ff; }
    .vf-coordinate-mode:hover { background: #f4f7fa; }

    .vf-coordinate-value {
      min-width: 238px;
      display: flex;
      align-items: center;
      padding: 0 9px;
      white-space: nowrap;
    }

    @media (max-width: 700px) {
      .vf-map-credit { right: 44px; bottom: 5px; }
      .vf-attrib-wrap { right: 6px; bottom: 5px; }
      .vf-attrib-panel { max-width: calc(100vw - 20px); }
      .vf-coordinate-control {
        left: 8px;
        bottom: 38px;
        max-width: calc(100vw - 16px);
      }
      .vf-coordinate-value { min-width: 180px; }
    }
  </style>
</head>
<body>
  <div id="map"></div>

  <a
    class="vf-map-credit"
    href="https://github.com/Vietflexmap/VN"
    target="_blank"
    rel="noopener noreferrer"
    aria-label="Vietflex OpenMap trên GitHub"
    title="Vietflex OpenMap trên GitHub">
    <span class="vf-flag" aria-hidden="true">
      <svg viewBox="0 0 30 20" xmlns="http://www.w3.org/2000/svg">
        <rect width="30" height="20" fill="#da251d"/>
        <polygon fill="#ffde00" points="15,3.1 16.75,8.45 22.38,8.45 17.82,11.76 19.56,17.1 15,13.8 10.44,17.1 12.18,11.76 7.62,8.45 13.25,8.45"/>
      </svg>
    </span>
    <span>Vietflex | OpenMap</span>
  </a>

  <div class="vf-attrib-wrap">
    <button
      id="vf-attrib-toggle"
      class="vf-attrib-toggle"
      type="button"
      aria-label="Thông tin nguồn bản đồ"
      aria-expanded="false"
      aria-controls="vf-attrib-panel"
      title="Thông tin nguồn bản đồ">ⓘ</button>

    <div id="vf-attrib-panel" class="vf-attrib-panel" role="dialog" aria-label="Nguồn dữ liệu bản đồ">
      Nhãn tham chiếu tiếng Việt: Vietflex OpenMap |
      <a href="https://openfreemap.org/" target="_blank" rel="noopener noreferrer">OpenFreeMap</a> |
      <a href="https://www.openmaptiles.org/" target="_blank" rel="noopener noreferrer">© OpenMapTiles</a> |
      Data from <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener noreferrer">OpenStreetMap</a>
    </div>
  </div>

  <div class="vf-coordinate-control" aria-label="Hiển thị tọa độ con trỏ">
    <div class="vf-coordinate-modes" role="group" aria-label="Hệ tọa độ">
      <button id="vf-mode-wgs84" class="vf-coordinate-mode is-active" type="button" aria-pressed="true">WGS84</button>
      <button id="vf-mode-vn2000" class="vf-coordinate-mode" type="button" aria-pressed="false" title="VN2000 tham chiếu UTM 48N/49N; hồ sơ địa chính cần cấu hình kinh tuyến trục/múi theo địa phương">VN2000</button>
    </div>
    <div id="vf-coordinate-value" class="vf-coordinate-value">Rê chuột trên bản đồ</div>
  </div>

  <script>
    const map = Vietflex.vietflexMap('map', {
      basemap: 'streets',
      language: 'vi',
      vietnamReferenceLabels: true,
      center: [13.8, 110.2],
      zoom: 4.6,
      zoomControl: false,
      attributionControl: false
    });

    new Vietflex.ZoomControl({ position: 'topleft' }).addTo(map);
    new Vietflex.BasemapControl({ position: 'topright' }).addTo(map);
    new Vietflex.ScaleControl({ position: 'bottomleft' }).addTo(map);

    const attribToggle = document.getElementById('vf-attrib-toggle');
    const attribPanel = document.getElementById('vf-attrib-panel');

    function setAttributionOpen(open) {
      attribPanel.classList.toggle('is-open', open);
      attribToggle.setAttribute('aria-expanded', String(open));
    }

    attribToggle.addEventListener('click', (event) => {
      event.stopPropagation();
      setAttributionOpen(!attribPanel.classList.contains('is-open'));
    });

    attribPanel.addEventListener('click', (event) => event.stopPropagation());
    document.addEventListener('click', () => setAttributionOpen(false));
    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape') setAttributionOpen(false);
    });

    // Chuyển WGS84 -> UTM (ellipsoid WGS84) dùng cho hiển thị VN2000 tham chiếu.
    // Việt Nam chủ yếu thuộc UTM 48N và 49N; zone được chọn tự động theo kinh độ.
    function wgs84ToUTM(latDeg, lonDeg) {
      const zone = Math.max(1, Math.min(60, Math.floor((lonDeg + 180) / 6) + 1));
      const a = 6378137.0;
      const f = 1 / 298.257223563;
      const e2 = f * (2 - f);
      const ep2 = e2 / (1 - e2);
      const k0 = 0.9996;
      const lat = latDeg * Math.PI / 180;
      const lon = lonDeg * Math.PI / 180;
      const lon0 = ((zone - 1) * 6 - 180 + 3) * Math.PI / 180;

      const sinLat = Math.sin(lat);
      const cosLat = Math.cos(lat);
      const tanLat = Math.tan(lat);
      const N = a / Math.sqrt(1 - e2 * sinLat * sinLat);
      const T = tanLat * tanLat;
      const C = ep2 * cosLat * cosLat;
      const A = cosLat * (lon - lon0);

      const M = a * (
        (1 - e2 / 4 - 3 * e2 * e2 / 64 - 5 * e2 * e2 * e2 / 256) * lat
        - (3 * e2 / 8 + 3 * e2 * e2 / 32 + 45 * e2 * e2 * e2 / 1024) * Math.sin(2 * lat)
        + (15 * e2 * e2 / 256 + 45 * e2 * e2 * e2 / 1024) * Math.sin(4 * lat)
        - (35 * e2 * e2 * e2 / 3072) * Math.sin(6 * lat)
      );

      const easting = 500000 + k0 * N * (
        A + (1 - T + C) * Math.pow(A, 3) / 6
        + (5 - 18 * T + T * T + 72 * C - 58 * ep2) * Math.pow(A, 5) / 120
      );

      let northing = k0 * (
        M + N * tanLat * (
          A * A / 2
          + (5 - T + 9 * C + 4 * C * C) * Math.pow(A, 4) / 24
          + (61 - 58 * T + T * T + 600 * C - 330 * ep2) * Math.pow(A, 6) / 720
        )
      );

      if (latDeg < 0) northing += 10000000;
      return { zone, easting, northing };
    }

    const coordValue = document.getElementById('vf-coordinate-value');
    const btnWgs84 = document.getElementById('vf-mode-wgs84');
    const btnVn2000 = document.getElementById('vf-mode-vn2000');
    let coordinateMode = 'wgs84';
    let lastLngLat = null;

    function setCoordinateMode(mode) {
      coordinateMode = mode;
      const isWgs = mode === 'wgs84';
      btnWgs84.classList.toggle('is-active', isWgs);
      btnVn2000.classList.toggle('is-active', !isWgs);
      btnWgs84.setAttribute('aria-pressed', String(isWgs));
      btnVn2000.setAttribute('aria-pressed', String(!isWgs));
      if (lastLngLat) renderCoordinate(lastLngLat);
    }

    function renderCoordinate(lngLat) {
      const lon = Number(lngLat.lng);
      const lat = Number(lngLat.lat);
      if (!Number.isFinite(lon) || !Number.isFinite(lat)) return;

      if (coordinateMode === 'wgs84') {
        coordValue.textContent = `Lat ${lat.toFixed(6)}°  Lon ${lon.toFixed(6)}°`;
      } else {
        const utm = wgs84ToUTM(lat, lon);
        const zone = utm.zone === 48 || utm.zone === 49 ? utm.zone : utm.zone;
        coordValue.textContent = `X ${utm.northing.toFixed(3)}  Y ${utm.easting.toFixed(3)}  Z${zone}N`;
      }
    }

    btnWgs84.addEventListener('click', () => setCoordinateMode('wgs84'));
    btnVn2000.addEventListener('click', () => setCoordinateMode('vn2000'));

    function suppressDuplicateBienDong(rawMap) {
      const style = rawMap.getStyle();
      if (!style || !Array.isArray(style.layers)) return;

      style.layers.forEach((layer) => {
        if (
          layer.type !== 'symbol' ||
          String(layer.id || '').startsWith('vietflex-') ||
          !layer.layout ||
          layer.layout['text-field'] === undefined
        ) return;

        try {
          const current = rawMap.getLayoutProperty(layer.id, 'text-field');
          if (current === undefined || current === null) return;
          const featureName = ['coalesce', ['get', 'name:vi'], ['get', 'name_vi'], ['get', 'name']];
          rawMap.setLayoutProperty(layer.id, 'text-field', [
            'case',
            ['==', featureName, 'Biển Đông'],
            '',
            current
          ]);
        } catch (_) {}
      });
    }

    map.ready((rawMap) => {
      const apply = () => setTimeout(() => suppressDuplicateBienDong(rawMap), 0);
      rawMap.on('style.load', apply);
      if (rawMap.isStyleLoaded()) apply();

      rawMap.on('mousemove', (event) => {
        lastLngLat = event.lngLat;
        renderCoordinate(event.lngLat);
      });

      rawMap.getCanvas().addEventListener('mouseleave', () => {
        lastLngLat = null;
        coordValue.textContent = 'Rê chuột trên bản đồ';
      });
    });

    if (Vietflex.CoreTech) {
      Vietflex.CoreTech.configure({ language: 'vi', datasetVersion: 'dev' });
      Vietflex.CoreTech.Adapters.register('maplibre', {}, {
        kind: 'maplibre', status: 'active', role: 'renderer'
      });
      Vietflex.CoreTech.Gateways.register('cdn', {}, {
        port: 'cdn', status: 'active', role: 'static-distribution'
      });
    }
  </script>
</body>
</html>
