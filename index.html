<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vietflex Platform Core — Bản đồ nền mã nguồn mở</title>

  <link rel="stylesheet" href="./dist/vietflex.css">
  <script src="./dist/vietflex.js"></script>
  <script src="./dist/vietflex-core.js"></script>
  <script src="./dist/vietflex-platform.js"></script>

  <style>
    html, body { margin: 0; height: 100%; }
    #map { width: 100%; height: 100%; }
    .core-badge {
      position: absolute;
      left: 12px;
      top: 12px;
      z-index: 5;
      background: rgba(255,255,255,.94);
      padding: 8px 10px;
      border-radius: 8px;
      font: 12px/1.4 system-ui, sans-serif;
      box-shadow: 0 2px 12px rgba(0,0,0,.15);
      pointer-events: none;
    }
    .core-badge strong { display:block; font-size:13px; }
  </style>
</head>
<body>
  <div id="map"></div>
  <div class="core-badge">
    <strong>Vietflex Platform Core</strong>
    Basemap · Places · Road Graph · IoT · GeoAI
  </div>

  <script>
    const map = Vietflex.vietflexMap('map', {
      basemap: 'streets',
      language: 'vi',
      vietnamReferenceLabels: true,
      center: [13.8, 110.2],
      zoom: 4.6,
      zoomControl: false,
      attributionControl: false
    });

    new Vietflex.ZoomControl({ position: 'topleft' }).addTo(map);
    new Vietflex.BasemapControl({ position: 'topright' }).addTo(map);
    new Vietflex.ScaleControl({ position: 'bottomleft' }).addTo(map);
    new Vietflex.AttributionControl({
      position: 'bottomright',
      customAttribution: 'Vietflex OpenMap · MapLibre · OpenStreetMap/OpenFreeMap'
    }).addTo(map);

    new Vietflex.Marker([21.0285, 105.8542])
      .bindPopup('<strong>Hà Nội</strong><br>Vietflex Platform Core + MapLibre')
      .addTo(map);

    // Giữ duy nhất nhãn Biển Đông do lớp tham chiếu Vietflex quản lý.
    function suppressDuplicateBienDong(rawMap) {
      const style = rawMap.getStyle();
      if (!style || !Array.isArray(style.layers)) return;

      style.layers.forEach((layer) => {
        if (
          layer.type !== 'symbol' ||
          String(layer.id || '').startsWith('vietflex-') ||
          !layer.layout ||
          layer.layout['text-field'] === undefined
        ) return;

        try {
          const current = rawMap.getLayoutProperty(layer.id, 'text-field');
          if (current === undefined || current === null) return;

          const featureName = [
            'coalesce',
            ['get', 'name:vi'],
            ['get', 'name_vi'],
            ['get', 'name']
          ];

          rawMap.setLayoutProperty(layer.id, 'text-field', [
            'case',
            ['==', featureName, 'Biển Đông'],
            '',
            current
          ]);
        } catch (_) {}
      });
    }

    map.ready((rawMap) => {
      const apply = () => setTimeout(() => suppressDuplicateBienDong(rawMap), 0);
      rawMap.on('style.load', apply);
      if (rawMap.isStyleLoaded()) apply();
    });

    Vietflex.Platform.configure({
      language: 'vi',
      datasetVersion: 'dev'
    });

    console.info('Vietflex Core', Vietflex.Core.getConfig());
    console.info('Vietflex Platform', Vietflex.Platform.getConfig());
  </script>
</body>
</html>
