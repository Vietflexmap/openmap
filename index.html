<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vietflex OpenMap — MapLibre CDN</title>

  <link rel="stylesheet" href="./dist/vietflex.css">
  <script src="./dist/vietflex.js"></script>

  <style>
    html, body { margin: 0; height: 100%; }
    #map { width: 100%; height: 100%; }
  </style>
</head>
<body>
  <div id="map"></div>

  <script>
    const map = Vietflex.vietflexMap('map', {
      style: 'https://demotiles.maplibre.org/style.json',
      center: [21.0285, 105.8542],
      zoom: 11,
      zoomControl: false,
      attributionControl: false
    });

    new Vietflex.ZoomControl({ position: 'topleft' }).addTo(map);
    new Vietflex.AttributionControl({ position: 'bottomright' }).addTo(map);

    new Vietflex.Marker([21.0285, 105.8542])
      .bindPopup('<strong>Hà Nội</strong><br>Vietflex OpenMap + MapLibre')
      .addTo(map);
  </script>
</body>
</html>
