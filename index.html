<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vietflex OpenMap — Bản đồ nền mã nguồn mở</title>

  <link rel="stylesheet" href="./dist/vietflex.css">
  <script src="./dist/vietflex.js"></script>

  <style>
    html, body { margin: 0; height: 100%; }
    #map { width: 100%; height: 100%; }
  </style>
</head>
<body>
  <div id="map"></div>

  <script>
    const map = Vietflex.vietflexMap('map', {
      basemap: 'streets',
      language: 'vi',
      vietnamReferenceLabels: true,
      center: [13.8, 110.2],
      zoom: 4.6,
      zoomControl: false,
      attributionControl: false
    });

    new Vietflex.ZoomControl({ position: 'topleft' }).addTo(map);
    new Vietflex.BasemapControl({ position: 'topright' }).addTo(map);
    new Vietflex.ScaleControl({ position: 'bottomleft' }).addTo(map);
    new Vietflex.AttributionControl({
      position: 'bottomright',
      customAttribution: 'Vietflex OpenMap · MapLibre · OpenStreetMap/OpenFreeMap'
    }).addTo(map);

    new Vietflex.Marker([21.0285, 105.8542])
      .bindPopup('<strong>Hà Nội</strong><br>Bản đồ nền Vietflex + MapLibre')
      .addTo(map);
  </script>
</body>
</html>
