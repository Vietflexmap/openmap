<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vietflex OpenMap</title>

  <link rel="stylesheet" href="./dist/vietflex.css?v=20260917-vfbasemap1">
  <script src="./dist/vietflex.js?v=20260917-vfbasemap1"></script>
  <script src="./dist/vietflex-core.js?v=20260917-vfbasemap1"></script>
  <script src="./dist/vietflex-platform.js?v=20260917-vfbasemap1"></script>
  <script src="./plugins/basemaps.js?v=vnmap-0.4.0"></script>
  <script src="./plugins/layers.js?v=20260917-vfbasemap1"></script>
  <script src="./plugins/layer-adapters.js?v=20260917-vfbasemap1"></script>

  <style>
    html,body{margin:0;height:100%;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}#map{width:100%;height:100%}
    .vf-map-credit{position:absolute;right:46px;bottom:6px;z-index:999;display:inline-flex;align-items:center;gap:7px;padding:5px 10px;border:1px solid rgba(21,101,192,.14);border-radius:7px;background:rgba(255,255,255,.97);box-shadow:0 1px 5px rgba(0,0,0,.16);color:#1565c0;font:700 12px/1.2 system-ui,sans-serif;white-space:nowrap;text-decoration:none;cursor:pointer}.vf-map-credit:hover{color:#0d47a1;background:#fff}.vf-flag{width:20px;height:14px;display:inline-flex;overflow:hidden;border-radius:2px;box-shadow:0 0 0 1px rgba(0,0,0,.08)}.vf-flag svg{width:100%;height:100%;display:block}
    .vf-attrib-wrap{position:absolute;right:8px;bottom:6px;z-index:1000}.vf-attrib-toggle{width:30px;height:30px;border:0;border-radius:50%;background:rgba(255,255,255,.97);box-shadow:0 1px 5px rgba(0,0,0,.18);color:#17212b;font:700 18px/30px Georgia,serif;padding:0;cursor:pointer}.vf-attrib-panel{position:absolute;right:0;bottom:36px;display:none;width:max-content;max-width:min(760px,calc(100vw - 24px));padding:7px 10px;border-radius:7px;background:rgba(255,255,255,.98);box-shadow:0 2px 10px rgba(0,0,0,.20);color:#26313b;font:11px/1.4 system-ui,sans-serif}.vf-attrib-panel.is-open{display:block}.vf-attrib-panel a{color:#1565c0;text-decoration:none}.vf-attrib-panel a:hover{text-decoration:underline}
    .vf-coordinate-control{position:absolute;left:118px;bottom:6px;z-index:998;display:inline-flex;align-items:stretch;min-height:28px;border:1px solid rgba(0,0,0,.12);border-radius:6px;background:rgba(255,255,255,.96);box-shadow:0 1px 4px rgba(0,0,0,.15);overflow:hidden;color:#17212b;font:11px/1.2 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.vf-coordinate-modes{display:inline-flex;border-right:1px solid rgba(0,0,0,.10)}.vf-coordinate-mode{border:0;border-right:1px solid rgba(0,0,0,.08);background:transparent;color:#53606d;font:700 10px/1 system-ui,sans-serif;padding:0 8px;cursor:pointer}.vf-coordinate-mode:last-child{border-right:0}.vf-coordinate-mode.is-active{color:#0d47a1;background:#eaf3ff}.vf-coordinate-value{min-width:238px;display:flex;align-items:center;padding:0 9px;white-space:nowrap}
    .vf-tools{position:absolute;top:10px;right:10px;z-index:1100}.vf-tools-toggle{width:38px;height:38px;border:0;border-radius:8px;background:rgba(255,255,255,.97);box-shadow:0 1px 6px rgba(0,0,0,.20);color:#26313b;font:700 20px/38px system-ui,sans-serif;padding:0;cursor:pointer}.vf-tools-panel{position:absolute;right:0;top:46px;width:244px;display:none;overflow:hidden;border:1px solid rgba(0,0,0,.10);border-radius:10px;background:rgba(255,255,255,.98);box-shadow:0 6px 24px rgba(0,0,0,.20);color:#26313b}.vf-tools-panel.is-open{display:block}.vf-tool-item,.vf-tool-title{width:100%;box-sizing:border-box;border:0;background:transparent;color:#26313b;text-align:left;padding:10px 12px;font:600 13px/1.2 system-ui,sans-serif;cursor:pointer;border-bottom:1px solid #eef0f2}.vf-tool-item:hover,.vf-tool-title:hover{background:#f5f8fb}.vf-tool-title{display:flex;align-items:center;justify-content:space-between}.vf-submenu{display:none;padding:6px;background:#f8fafc;border-bottom:1px solid #eef0f2}.vf-submenu.is-open{display:block}.vf-basemap-option{width:100%;border:0;border-radius:7px;background:transparent;text-align:left;padding:9px;color:#334155;font:12px/1.2 system-ui,sans-serif;cursor:pointer}.vf-basemap-option:hover{background:#eaf3ff}.vf-basemap-option.is-active{color:#0d47a1;background:#eaf3ff;font-weight:700}.vf-basemap-meta{display:block;margin-top:3px;color:#7a8795;font-size:10px;font-weight:500}.vf-search-box{display:none;padding:8px;background:#f8fafc;border-bottom:1px solid #eef0f2}.vf-search-box.is-open{display:flex;gap:6px}.vf-search-box input{min-width:0;flex:1;border:1px solid #cfd7df;border-radius:6px;padding:7px 8px;font:12px system-ui,sans-serif}.vf-search-box button{border:0;border-radius:6px;background:#1565c0;color:#fff;padding:0 10px;cursor:pointer}.vf-measure-status{display:none;padding:8px 10px;background:#fff8e1;color:#6b4f00;font:11px/1.35 system-ui,sans-serif;border-bottom:1px solid #f0e0a0}.vf-measure-status.is-open{display:block}
    @media print{.vf-tools,.vf-attrib-wrap,.vf-coordinate-control{display:none!important}.vf-map-credit{right:8px;bottom:8px}}@media(max-width:700px){.vf-map-credit{right:44px;bottom:5px}.vf-attrib-wrap{right:6px;bottom:5px}.vf-coordinate-control{left:8px;bottom:38px;max-width:calc(100vw - 16px)}.vf-coordinate-value{min-width:180px}.vf-tools-panel{width:min(244px,calc(100vw - 20px))}}
  </style>
</head>
<body>
  <div id="map"></div>

  <div class="vf-tools">
    <button id="vf-tools-toggle" class="vf-tools-toggle" type="button" aria-label="Mở menu công cụ" aria-expanded="false" title="Công cụ bản đồ">☰</button>
    <div id="vf-tools-panel" class="vf-tools-panel" aria-label="Công cụ bản đồ">
      <button id="vf-basemap-title" class="vf-tool-title" type="button" aria-expanded="false"><span>▣ Nền bản đồ</span><span>›</span></button>
      <div id="vf-basemap-menu" class="vf-submenu"></div>
      <button id="vf-measure-toggle" class="vf-tool-item" type="button">↔ Thước đo</button>
      <div id="vf-measure-status" class="vf-measure-status">Bấm các điểm trên bản đồ để đo khoảng cách. Bấm “Thước đo” lần nữa để kết thúc.</div>
      <button id="vf-search-toggle" class="vf-tool-item" type="button">⌕ Tra cứu</button>
      <div id="vf-search-box" class="vf-search-box"><input id="vf-search-input" type="text" placeholder="VD: 10.7769, 106.7009" aria-label="Nhập tọa độ để tra cứu"><button id="vf-search-go" type="button">Đi</button></div>
      <button id="vf-geolocate" class="vf-tool-item" type="button">◎ Tìm vị trí</button>
      <button id="vf-print" class="vf-tool-item" type="button">⎙ In bản đồ</button>
    </div>
  </div>

  <a class="vf-map-credit" href="https://github.com/Vietflexmap/VN" target="_blank" rel="noopener noreferrer" aria-label="Vietflex OpenMap trên GitHub" title="Vietflex OpenMap trên GitHub"><span class="vf-flag" aria-hidden="true"><svg viewBox="0 0 30 20" xmlns="http://www.w3.org/2000/svg"><rect width="30" height="20" fill="#da251d"/><polygon fill="#ffde00" points="15,3.1 16.75,8.45 22.38,8.45 17.82,11.76 19.56,17.1 15,13.8 10.44,17.1 12.18,11.76 7.62,8.45 13.25,8.45"/></svg></span><span>Vietflex | OpenMap</span></a>

  <div class="vf-attrib-wrap"><button id="vf-attrib-toggle" class="vf-attrib-toggle" type="button" aria-label="Thông tin nguồn bản đồ" aria-expanded="false" aria-controls="vf-attrib-panel" title="Thông tin nguồn bản đồ">ⓘ</button><div id="vf-attrib-panel" class="vf-attrib-panel" role="dialog" aria-label="Nguồn dữ liệu bản đồ"></div></div>

  <div class="vf-coordinate-control" aria-label="Hiển thị tọa độ con trỏ"><div class="vf-coordinate-modes" role="group" aria-label="Hệ tọa độ"><button id="vf-mode-wgs84" class="vf-coordinate-mode is-active" type="button" aria-pressed="true">WGS84</button><button id="vf-mode-vn2000" class="vf-coordinate-mode" type="button" aria-pressed="false" title="VN2000 tham chiếu UTM 48N/49N; hồ sơ địa chính cần cấu hình kinh tuyến trục/múi theo địa phương">VN2000</button></div><div id="vf-coordinate-value" class="vf-coordinate-value">Rê chuột trên bản đồ</div></div>

  <script>
    const map=Vietflex.vietflexMap('map',{basemap:'light',language:'vi',vietnamReferenceLabels:true,center:[13.8,110.2],zoom:4.6,zoomControl:false,attributionControl:false});
    new Vietflex.ZoomControl({position:'topleft'}).addTo(map);new Vietflex.ScaleControl({position:'bottomleft'}).addTo(map);

    const toolsToggle=document.getElementById('vf-tools-toggle'),toolsPanel=document.getElementById('vf-tools-panel');
    toolsToggle.addEventListener('click',(e)=>{e.stopPropagation();const open=!toolsPanel.classList.contains('is-open');toolsPanel.classList.toggle('is-open',open);toolsToggle.setAttribute('aria-expanded',String(open))});toolsPanel.addEventListener('click',(e)=>e.stopPropagation());
    const basemapTitle=document.getElementById('vf-basemap-title'),basemapMenu=document.getElementById('vf-basemap-menu');
    basemapTitle.addEventListener('click',()=>{const open=!basemapMenu.classList.contains('is-open');basemapMenu.classList.toggle('is-open',open);basemapTitle.setAttribute('aria-expanded',String(open))});
    function renderBasemapMenu(){basemapMenu.innerHTML='';VietflexBasemaps.list().forEach((item)=>{const btn=document.createElement('button');btn.className='vf-basemap-option'+(item.id===VietflexBasemaps.active().id?' is-active':'');btn.type='button';btn.dataset.basemap=item.id;btn.innerHTML=`<strong>${item.name}</strong><span class="vf-basemap-meta">${item.provider} · ${item.kind}</span>`;btn.addEventListener('click',async()=>{btn.disabled=true;try{const result=await VietflexBasemaps.apply(map,item.id);document.querySelectorAll('.vf-basemap-option').forEach((x)=>x.classList.toggle('is-active',x.dataset.basemap===item.id));updateAttribution(item.id,result)}finally{btn.disabled=false}});basemapMenu.appendChild(btn)})}

    const attribToggle=document.getElementById('vf-attrib-toggle'),attribPanel=document.getElementById('vf-attrib-panel');
    function setAttributionOpen(open){attribPanel.classList.toggle('is-open',open);attribToggle.setAttribute('aria-expanded',String(open))}attribToggle.addEventListener('click',(e)=>{e.stopPropagation();setAttributionOpen(!attribPanel.classList.contains('is-open'))});attribPanel.addEventListener('click',(e)=>e.stopPropagation());
    function updateAttribution(id,result){const base=VietflexBasemaps.get(id);if(base.id==='terrain'){attribPanel.innerHTML='Vietflex Terrain / Topo | DEM pipeline tự quản lý qua Vietflex terrain manifest';}else if(base.id==='satellite'){attribPanel.innerHTML='Nhãn tham chiếu tiếng Việt: Vietflex OpenMap | <a href="https://services.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer" target="_blank" rel="noopener noreferrer">Esri World Imagery</a> | Sources: Esri and World Imagery data providers';}else if(base.id==='tedp'){attribPanel.innerHTML='Vietflex TEDP | Nguồn ảnh nền: <a href="https://tedp.vn/" target="_blank" rel="noopener noreferrer">TEDP</a> | Đọc trực tiếp từ máy chủ TEDP';}else if(base.id==='vnmap'){const mode=result&&result.status==='ready'?'SELF-HOSTED':'BOOTSTRAP';attribPanel.innerHTML='VNMap Core | '+mode+' | 4 miền: basemap · transport · poi · building'+(result&&result.datasetVersion?' | dataset '+result.datasetVersion:'')+(mode==='BOOTSTRAP'?' | dữ liệu vector mở làm nền tạm thời':'');}else if(base.id==='vietflex'){attribPanel.innerHTML='Vietflex Basemap | raster XYZ/PMTiles adapter tự quản lý' + (result&&result.status==='awaiting-data'?' | Gói tile đang chờ publish lên CDN/GitHub Pages':'');}else{attribPanel.innerHTML='Nhãn tham chiếu tiếng Việt: Vietflex OpenMap | <a href="https://openfreemap.org/" target="_blank" rel="noopener noreferrer">OpenFreeMap</a> | <a href="https://www.openmaptiles.org/" target="_blank" rel="noopener noreferrer">© OpenMapTiles</a> | Data from <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener noreferrer">OpenStreetMap</a>'}}
    renderBasemapMenu();updateAttribution('simple');

    function wgs84ToUTM(latDeg,lonDeg){const zone=Math.max(1,Math.min(60,Math.floor((lonDeg+180)/6)+1)),a=6378137.0,f=1/298.257223563,e2=f*(2-f),ep2=e2/(1-e2),k0=.9996,lat=latDeg*Math.PI/180,lon=lonDeg*Math.PI/180,lon0=((zone-1)*6-180+3)*Math.PI/180,sinLat=Math.sin(lat),cosLat=Math.cos(lat),tanLat=Math.tan(lat),N=a/Math.sqrt(1-e2*sinLat*sinLat),T=tanLat*tanLat,C=ep2*cosLat*cosLat,A=cosLat*(lon-lon0),M=a*((1-e2/4-3*e2*e2/64-5*e2*e2*e2/256)*lat-(3*e2/8+3*e2*e2/32+45*e2*e2*e2/1024)*Math.sin(2*lat)+(15*e2*e2/256+45*e2*e2*e2/1024)*Math.sin(4*lat)-(35*e2*e2*e2/3072)*Math.sin(6*lat)),easting=500000+k0*N*(A+(1-T+C)*A**3/6+(5-18*T+T*T+72*C-58*ep2)*A**5/120);let northing=k0*(M+N*tanLat*(A*A/2+(5-T+9*C+4*C*C)*A**4/24+(61-58*T+T*T+600*C-330*ep2)*A**6/720));if(latDeg<0)northing+=10000000;return{zone,easting,northing}}
    const coordValue=document.getElementById('vf-coordinate-value'),btnWgs84=document.getElementById('vf-mode-wgs84'),btnVn2000=document.getElementById('vf-mode-vn2000');let coordinateMode='wgs84',lastLngLat=null;
    function renderCoordinate(lngLat){const lon=Number(lngLat.lng),lat=Number(lngLat.lat);if(!Number.isFinite(lon)||!Number.isFinite(lat))return;if(coordinateMode==='wgs84')coordValue.textContent=`Lat ${lat.toFixed(6)}°  Lon ${lon.toFixed(6)}°`;else{const u=wgs84ToUTM(lat,lon);coordValue.textContent=`X ${u.northing.toFixed(3)}  Y ${u.easting.toFixed(3)}  Z${u.zone}N`}}
    function setCoordinateMode(mode){coordinateMode=mode;const w=mode==='wgs84';btnWgs84.classList.toggle('is-active',w);btnVn2000.classList.toggle('is-active',!w);btnWgs84.setAttribute('aria-pressed',String(w));btnVn2000.setAttribute('aria-pressed',String(!w));if(lastLngLat)renderCoordinate(lastLngLat)}btnWgs84.addEventListener('click',()=>setCoordinateMode('wgs84'));btnVn2000.addEventListener('click',()=>setCoordinateMode('vn2000'));

    const measureToggle=document.getElementById('vf-measure-toggle'),measureStatus=document.getElementById('vf-measure-status');let measuring=false,measurePoints=[],measureKm=0;
    function haversine(a,b){const R=6371,p=Math.PI/180,dLat=(b.lat-a.lat)*p,dLon=(b.lng-a.lng)*p,x=Math.sin(dLat/2)**2+Math.cos(a.lat*p)*Math.cos(b.lat*p)*Math.sin(dLon/2)**2;return 2*R*Math.asin(Math.sqrt(x))}function setMeasuring(on){measuring=on;measureToggle.textContent=on?'✕ Kết thúc đo':'↔ Thước đo';measureStatus.classList.toggle('is-open',on);if(on){measurePoints=[];measureKm=0;measureStatus.textContent='Bấm các điểm trên bản đồ để đo khoảng cách.'}}measureToggle.addEventListener('click',()=>setMeasuring(!measuring));
    const searchToggle=document.getElementById('vf-search-toggle'),searchBox=document.getElementById('vf-search-box');searchToggle.addEventListener('click',()=>searchBox.classList.toggle('is-open'));
    function runCoordinateSearch(){const raw=document.getElementById('vf-search-input').value.trim().replace(/;/g,','),p=raw.split(/[ ,]+/).filter(Boolean).map(Number);if(p.length<2||!Number.isFinite(p[0])||!Number.isFinite(p[1]))return;map.flyTo({center:[p[0],p[1]],zoom:16})}document.getElementById('vf-search-go').addEventListener('click',runCoordinateSearch);document.getElementById('vf-search-input').addEventListener('keydown',(e)=>{if(e.key==='Enter')runCoordinateSearch()});
    document.getElementById('vf-geolocate').addEventListener('click',()=>{if(!navigator.geolocation)return;navigator.geolocation.getCurrentPosition((pos)=>map.flyTo({center:[pos.coords.latitude,pos.coords.longitude],zoom:16}),()=>{},{enableHighAccuracy:true,timeout:10000})});document.getElementById('vf-print').addEventListener('click',()=>window.print());

    function suppressDuplicateBienDong(rawMap){const style=rawMap.getStyle();if(!style||!Array.isArray(style.layers))return;style.layers.forEach((layer)=>{if(layer.type!=='symbol'||String(layer.id||'').startsWith('vietflex-')||!layer.layout||layer.layout['text-field']===undefined)return;try{const current=rawMap.getLayoutProperty(layer.id,'text-field');if(current===undefined||current===null)return;const name=['coalesce',['get','name:vi'],['get','name_vi'],['get','name']];rawMap.setLayoutProperty(layer.id,'text-field',['case',['==',name,'Biển Đông'],'',current])}catch(_){}})}
    map.ready((rawMap)=>{rawMap.on('mousemove',(e)=>{lastLngLat=e.lngLat;renderCoordinate(lastLngLat)});rawMap.on('click',(e)=>{if(!measuring)return;const p={lat:e.lngLat.lat,lng:e.lngLat.lng};if(measurePoints.length)measureKm+=haversine(measurePoints[measurePoints.length-1],p);measurePoints.push(p);measureStatus.textContent=`${measurePoints.length} điểm · ${measureKm<1?(measureKm*1000).toFixed(1)+' m':measureKm.toFixed(3)+' km'}`});const apply=()=>setTimeout(()=>suppressDuplicateBienDong(rawMap),0);rawMap.on('style.load',apply);if(rawMap.isStyleLoaded())apply()});
    document.addEventListener('click',()=>{toolsPanel.classList.remove('is-open');toolsToggle.setAttribute('aria-expanded','false');setAttributionOpen(false)});document.addEventListener('keydown',(e)=>{if(e.key==='Escape'){toolsPanel.classList.remove('is-open');setAttributionOpen(false)}});

    if(Vietflex.CoreTech){Vietflex.CoreTech.configure({language:'vi',datasetVersion:'dev'});Vietflex.CoreTech.Adapters.register('maplibre',{}, {kind:'maplibre',status:'active',role:'renderer'});Vietflex.CoreTech.Gateways.register('cdn',{}, {port:'cdn',status:'active',role:'static-distribution'});}
    if(window.VietflexLayers){window.VietflexLayers.installIntoCore();console.info('Vietflex GIS Layer Platform',window.VietflexLayers.manifest())}
  </script>
</body>
</html>
