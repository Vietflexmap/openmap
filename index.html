<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vietflex OpenMap</title>

  <link rel="stylesheet" href="./dist/vietflex.css?v=20260916-0820">
  <script src="./dist/vietflex.js?v=20260916-0820"></script>
  <script src="./dist/vietflex-core.js?v=20260916-0820"></script>
  <script src="./dist/vietflex-platform.js?v=20260916-0820"></script>

  <style>
    html, body { margin: 0; height: 100%; font-family: system-ui, sans-serif; }
    #map { width: 100%; height: 100%; }

    .vf-map-credit {
      position: absolute;
      right: 42px;
      bottom: 6px;
      z-index: 999;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 8px;
      border-radius: 6px;
      background: rgba(255,255,255,.96);
      box-shadow: 0 1px 5px rgba(0,0,0,.18);
      color: #17212b;
      font: 600 11px/1.2 system-ui, sans-serif;
      white-space: nowrap;
      text-decoration: none;
      cursor: pointer;
    }

    .vf-map-credit:hover {
      background: #fff;
      text-decoration: underline;
    }

    .vf-map-credit:focus-visible {
      outline: 2px solid #17212b;
      outline-offset: 2px;
    }

    .vf-map-credit .flag {
      font-size: 15px;
      line-height: 1;
    }

    .maplibregl-ctrl-attrib.maplibregl-compact {
      min-width: 28px;
      min-height: 28px;
    }

    @media (max-width: 700px) {
      .vf-map-credit { right: 40px; bottom: 5px; }
    }
  </style>
</head>
<body>
  <div id="map"></div>

  <a
    class="vf-map-credit"
    href="https://github.com/Vietflexmap/VN"
    target="_blank"
    rel="noopener noreferrer"
    aria-label="Vietflex OpenMap trên GitHub"
    title="Vietflex OpenMap trên GitHub">
    <span class="flag" aria-hidden="true">🇻🇳</span>
    <span>© Vietflex | OpenMap</span>
  </a>

  <script>
    const map = Vietflex.vietflexMap('map', {
      basemap: 'streets',
      language: 'vi',
      vietnamReferenceLabels: true,
      center: [13.8, 110.2],
      zoom: 4.6,
      zoomControl: false,
      attributionControl: false
    });

    new Vietflex.ZoomControl({ position: 'topleft' }).addTo(map);
    new Vietflex.BasemapControl({ position: 'topright' }).addTo(map);
    new Vietflex.ScaleControl({ position: 'bottomleft' }).addTo(map);

    // Attribution nguồn dữ liệu vẫn được giữ trong nút info compact.
    new Vietflex.AttributionControl({
      position: 'bottomright',
      compact: true
    }).addTo(map);

    // Giữ duy nhất nhãn Biển Đông do lớp tham chiếu Vietflex quản lý.
    function suppressDuplicateBienDong(rawMap) {
      const style = rawMap.getStyle();
      if (!style || !Array.isArray(style.layers)) return;

      style.layers.forEach((layer) => {
        if (
          layer.type !== 'symbol' ||
          String(layer.id || '').startsWith('vietflex-') ||
          !layer.layout ||
          layer.layout['text-field'] === undefined
        ) return;

        try {
          const current = rawMap.getLayoutProperty(layer.id, 'text-field');
          if (current === undefined || current === null) return;

          const featureName = [
            'coalesce',
            ['get', 'name:vi'],
            ['get', 'name_vi'],
            ['get', 'name']
          ];

          rawMap.setLayoutProperty(layer.id, 'text-field', [
            'case',
            ['==', featureName, 'Biển Đông'],
            '',
            current
          ]);
        } catch (_) {}
      });
    }

    map.ready((rawMap) => {
      const apply = () => setTimeout(() => suppressDuplicateBienDong(rawMap), 0);
      rawMap.on('style.load', apply);
      if (rawMap.isStyleLoaded()) apply();
    });

    // Core Tech vẫn được nạp làm nền kỹ thuật, nhưng không hiển thị bảng kiến trúc trên UI.
    if (Vietflex.CoreTech) {
      Vietflex.CoreTech.configure({ language: 'vi', datasetVersion: 'dev' });
      Vietflex.CoreTech.Adapters.register('maplibre', {}, {
        kind: 'maplibre',
        status: 'active',
        role: 'renderer'
      });
      Vietflex.CoreTech.Gateways.register('cdn', {}, {
        port: 'cdn',
        status: 'active',
        role: 'static-distribution'
      });
    }
  </script>
</body>
</html>
